<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#081428" media="(prefers-color-scheme: dark)" />
    <title>ML Study Hub · Atlante di Machine Learning</title>
    <script>
      // tema prima del primo paint: preferenza salvata ('light' | 'dark'), altrimenti quella del sistema
      ;(function () {
        var root = document.documentElement
        try {
          var key = 'ml-study-theme'
          var media = window.matchMedia('(prefers-color-scheme: dark)')
          var apply = function () {
            var saved = localStorage.getItem(key)
            root.dataset.theme = saved === 'dark' || saved === 'light' ? saved : media.matches ? 'dark' : 'light'
          }
          apply()
          media.addEventListener('change', apply)
        } catch (e) {
          root.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
